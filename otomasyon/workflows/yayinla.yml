name: Yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle-ve-yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: pip install pillow

      - name: Derle
        run: |
          npm run build
          python3 build-single.py

      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p yayin
          # Tek dosyalık sürüm ana sayfa olur: sunucu yapılandırması gerekmez
          cp chip-akademi.html yayin/index.html
          touch yayin/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yayin
      - id: deployment
        uses: actions/deploy-pages@v4
